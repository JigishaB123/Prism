name: prism

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prism}
      POSTGRES_USER: ${POSTGRES_USER:-prism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prism}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingestion:
    build: ../services/ingestion
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-prism}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-prism}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-prism}
    ports:
      - "8080:8080"
    depends_on:
      # Wait for Postgres to accept connections, not just for its container to start.
      postgres:
        condition: service_healthy

volumes:
  pgdata:
